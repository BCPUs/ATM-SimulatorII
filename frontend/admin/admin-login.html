<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Administrador - ATM Simulator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0a1f44; color: white; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .container { background: #111; padding: 50px 40px; border-radius: 15px; box-shadow: 0 0 30px rgba(0,0,0,0.8); width: 380px; text-align: center; }
    h2 { margin: 0 0 30px; font-size: 26px; color: #4da6ff; }
    input { width: 100%; padding: 15px; margin: 12px 0; font-size: 17px; border-radius: 8px; border: none; box-sizing: border-box; }
    button { width: 100%; padding: 15px; background: #0066cc; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background: #0055aa; }
    #msg { color: #ff4444; margin-top: 20px; font-weight: bold; min-height: 24px; }
    .back { margin-top: 25px; font-size: 14px; }
    .back a { color: #4da6ff; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <h2>ADMINISTRADOR</h2>
  <input id="adminUsuario" placeholder="Usuario (ej 0000)" type="text" autocomplete="off">
  <input id="adminClave" type="password" placeholder="Clave" autocomplete="off">
  <button onclick="adminLogin()">INGRESAR</button>
  <div id="msg"></div>
  <div class="back">
    <a href="../cajero.html">← Volver al Cajero</a>
  </div>
</div>

<script>
async function adminLogin() {
  const usuario = document.getElementById("adminUsuario").value.trim();
  const clave = document.getElementById("adminClave").value.trim();
  const msg = document.getElementById("msg");
  msg.textContent = "";

  if (!usuario || !clave) {
    msg.textContent = "Complete usuario y clave";
    return;
  }

  try {
    const res = await fetch("http://localhost:3000/usuarios/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario, clave })
    });

    if (!res.ok) {
      msg.textContent = await res.text();
      return;
    }

    localStorage.setItem("adminLoggedIn", "true");
    window.location.href = "admin-dashboard.html";
  } catch (err) {
    msg.textContent = "Error de conexión";
  }
}
</script>
</body>
</html>
